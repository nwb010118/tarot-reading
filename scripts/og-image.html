<!doctype html>
<!-- 링크 미리보기 이미지(images/og-gamanjeombang.jpg)의 원본. 1200x630 창에서 열어 그대로 캡처한다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG 이미지 원본</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
    color: #ece6da;
    background:
      radial-gradient(circle at 78% 46%, #d8c08f1f, transparent 34%),
      radial-gradient(circle at 12% 0%, #21324a, transparent 55%),
      linear-gradient(160deg, #0d1828 0%, #0a121e 60%, #0b1420 100%);
  }
  .copy { position: absolute; left: 92px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 600px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .seal {
    display: grid; place-items: center; width: 74px; height: 86px;
    border: 2px solid #cb8670; border-radius: 9px 9px 22px 9px;
    color: #f5e5d4; background: #804536;
    font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 46px;
    transform: rotate(-5deg);
  }
  h1 { margin: 0; font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 92px; letter-spacing: -0.04em; color: #f0e4c8; }
  .tagline { margin: 30px 0 0; font-family: "Noto Serif KR", serif; font-size: 38px; font-weight: 500; color: #ead6a8; letter-spacing: -0.02em; }
  .rule { width: 420px; height: 1px; margin: 34px 0 26px; background: linear-gradient(90deg, #d8c08f88, transparent); }
  .modes { margin: 0; font-size: 28px; color: #c9cfd8; letter-spacing: 0.04em; }
  .modes b { color: #d8c08f; font-weight: 400; padding: 0 10px; }
  .orbit {
    position: absolute; width: 470px; height: 470px; left: 700px; top: 80px;
    border: 1px solid #d8c08f2a; border-radius: 50%;
    background: radial-gradient(circle, #d8c08f14, transparent 62%);
    box-shadow: 0 0 0 52px #d8c08f06, 0 0 0 110px #d8c08f04;
  }
  .star { position: absolute; border-radius: 50%; background: #f0dcae; box-shadow: 0 0 14px 3px #f0dcae80; }
  .card {
    position: absolute; left: 828px; top: 74px; width: 250px; margin: 0;
    transform: rotate(-5deg); border-radius: 16px; overflow: hidden;
    box-shadow: 0 34px 70px #000b, 0 0 0 1px #d8c08f66;
  }
  .card img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="orbit"></div>
  <span class="star" style="width:7px;height:7px;left:1110px;top:130px"></span>
  <span class="star" style="width:5px;height:5px;left:735px;top:470px"></span>
  <span class="star" style="width:4px;height:4px;left:640px;top:96px"></span>
  <figure class="card"><img src="../images/RWS_Tarot_10_Wheel_of_Fortune.webp" alt=""></figure>
  <div class="copy">
    <div class="brand"><span class="seal">가</span><h1>가만점방</h1></div>
    <p class="tagline">오늘의 흐름을 읽는 시간</p>
    <div class="rule"></div>
    <p class="modes">타로<b>·</b>별자리<b>·</b>띠운세<b>·</b>사주<b>·</b>궁합</p>
  </div>
</body>
</html>
